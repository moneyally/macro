name: build-windows-exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pynput pyautogui pillow pyinstaller

      - name: Make icon
        run: python make_icon.py

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole --name MacroPRO
          --icon icon.ico
          --collect-submodules pynput
          run.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroPRO-windows
          path: dist/MacroPRO.exe
          if-no-files-found: error
